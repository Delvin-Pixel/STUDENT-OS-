name: Finalize NEXA 1.94 stale guards

on:
  push:
    branches:
      - stage/nexa-1.94.0-data-api-remediation-readiness

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: nexa-1.94.0-data-api-remediation-readiness
      - name: Advance exact active package guards
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          old_name = "assert.equal(pkg.name, 'nexa-1-93');"
          new_name = "assert.equal(pkg.name, 'nexa-1-94');"
          old_version = "assert.equal(pkg.version, '1.93.0');"
          new_version = "assert.equal(pkg.version, '1.94.0');"

          changed = []
          for path in sorted(Path('scripts').glob('*.mjs')):
              text = path.read_text()
              updated = text.replace(old_name, new_name).replace(old_version, new_version)
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))

          print("Changed files:")
          print("\n".join(changed) if changed else "(none)")
          PY
      - name: Verify no active package guards remain
        shell: bash
        run: |
          if grep -RInF "assert.equal(pkg.name, 'nexa-1-93');" scripts; then exit 1; fi
          if grep -RInF "assert.equal(pkg.version, '1.93.0');" scripts; then exit 1; fi
      - name: Commit release guard sweep
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts
          git diff --cached --quiet && exit 0
          git commit -m "test(nexa): finalize active 1.94 package guards"
          git push origin HEAD:nexa-1.94.0-data-api-remediation-readiness
