name: NEXA B62 format audit once

on:
  push:
    branches: [parallel/nexa-b62-integration-audit-20261025]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format audit document and verify
        run: |
          set -euo pipefail
          pnpm exec prettier docs/parallel/NEXA-B62-INTEGRATION-READINESS.md --write
          pnpm exec prettier docs/parallel/NEXA-B62-INTEGRATION-READINESS.md --check
          git diff --check
      - name: Remove temporary workflow and commit documentation only
        run: |
          set -euo pipefail
          rm .github/workflows/nexa-b62-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/parallel/NEXA-B62-INTEGRATION-READINESS.md .github/workflows/nexa-b62-format-once.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "docs(nexa-b62): apply canonical Prettier formatting"
          git push origin HEAD:parallel/nexa-b62-integration-audit-20261025
