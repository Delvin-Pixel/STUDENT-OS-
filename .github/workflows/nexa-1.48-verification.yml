name: NEXA 1.48 RC verification

on:
  workflow_dispatch:
  push:
    branches:
      - nexa-1.48-verification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa-ci-password
          POSTGRES_DB: nexa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nexa:nexa-ci-password@127.0.0.1:5432/nexa_test
      AI_GATEWAY_API_KEY: ci-placeholder-not-used-for-live-model-calls
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-0123456789abcdef
      NEXA_DB_POOL_MAX: '5'
      NEXA_DB_STATEMENT_TIMEOUT_MS: '15000'
      NEXA_MODEL: openai/gpt-5.6-sol
      NEXA_AI_TOTAL_TIMEOUT_MS: '120000'
      NEXA_AI_STEP_TIMEOUT_MS: '45000'
      NEXA_AI_CHUNK_TIMEOUT_MS: '15000'
      NEXA_AI_MAX_RETRIES: '1'

    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Reconstruct exact NEXA RC payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nexa"
          cat .nexa-verify/v2-part-* | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/nexa-payload.tar.xz"
          echo "59d9ce1c9ae6bbb7f4f6d55ad2cced614c674083c98c7638a5d8611ad217df96  $RUNNER_TEMP/nexa-payload.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/nexa-payload.tar.xz" -C "$RUNNER_TEMP/nexa"
          grep -q '"version": "1.48.0-rc.1"' "$RUNNER_TEMP/nexa/package.json"

      - name: Apply audited CI-discovered repair
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p1 -d "$RUNNER_TEMP/nexa" < "$GITHUB_WORKSPACE/.nexa-verify/nexa-1.48-ci-fix.patch"

      - name: Promote reconstructed candidate to RC2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path(r"${RUNNER_TEMP}") / "nexa"
          for path in root.rglob("*"):
              if not path.is_file() or path.name.startswith("README_"):
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              updated = text.replace("1.48.0-rc.1", "1.48.0-rc.2").replace("nexa-1-48-rc1", "nexa-1-48-rc2")
              if updated != text:
                  path.write_text(updated)
          account = root / "lib/account.ts"
          text = account.read_text()
          text = text.replace("EXPORT_SCHEMA_VERSION = '1.17'", "EXPORT_SCHEMA_VERSION = '1.18'")
          text = text.replace(
              "select id, conversation_id, project_id, request_id, execution_attempt_id, tool_name",
              "select id, conversation_id, project_id, workflow_id, request_id, execution_attempt_id, tool_name",
          )
          account.write_text(text)
          for rel in (
              "scripts/test-account.mjs",
              "scripts/test-ai-runtime.mjs",
              "scripts/test-execution-attempts.mjs",
          ):
              p = root / rel
              p.write_text(p.read_text().replace("EXPORT_SCHEMA_VERSION = '1.17'", "EXPORT_SCHEMA_VERSION = '1.18'"))
          PY
          grep -q '"version": "1.48.0-rc.2"' "$RUNNER_TEMP/nexa/package.json"
          grep -q "EXPORT_SCHEMA_VERSION = '1.18'" "$RUNNER_TEMP/nexa/lib/account.ts"
          grep -q "project_id, workflow_id, request_id, execution_attempt_id" "$RUNNER_TEMP/nexa/lib/account.ts"

      - name: Use Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Pin npm
        run: npm install --global npm@10.9.2

      - name: Resolve dependency lock for this verification run
        working-directory: ${{ runner.temp }}/nexa
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Restore exact resolved dependency tree
        working-directory: ${{ runner.temp }}/nexa
        run: npm ci --no-audit --no-fund

      - name: Apply PostgreSQL migrations
        working-directory: ${{ runner.temp }}/nexa
        run: npm run migrate

      - name: Full verification gate
        working-directory: ${{ runner.temp }}/nexa
        run: npm run verify:ci

      - name: Prepare verified RC2 source artifact
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='./node_modules' --exclude='./.next' -cJf "$RUNNER_TEMP/nexa-1.48-rc2-verified.tar.xz" -C "$RUNNER_TEMP/nexa" .

      - name: Preserve verified RC2 source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexa-1.48-rc2-verified
          path: ${{ runner.temp }}/nexa-1.48-rc2-verified.tar.xz
          if-no-files-found: error
          retention-days: 14

      - name: Preserve resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexa-package-lock
          path: ${{ runner.temp }}/nexa/package-lock.json
          if-no-files-found: error
          retention-days: 14
