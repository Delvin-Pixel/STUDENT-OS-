name: B64.4 Prettier preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format-preview:
    if: github.event.pull_request.head.ref == 'parallel/track-b-b64-4-safe-rebase-proposal'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Format B64.4 source and print exact output
        run: |
          pnpm exec prettier client/src/lib/offlineWorkspaceRebase.ts --write
          echo 'B64_4_PRETTIER_OUTPUT_BEGIN'
          cat client/src/lib/offlineWorkspaceRebase.ts
          echo 'B64_4_PRETTIER_OUTPUT_END'
