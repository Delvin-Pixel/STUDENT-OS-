name: Stage NEXA 1.68 release guards

on:
  push:
    branches: [stage/nexa-1.68.0-operational-observability]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa-ci-password
          POSTGRES_DB: nexa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexa:nexa-ci-password@127.0.0.1:5432/nexa_test
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-0123456789abcdef
      AI_GATEWAY_API_KEY: ci-placeholder-not-used-for-live-model-calls
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/nexa-1.68.0-operational-observability
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - run: npm install --global npm@10.9.2
      - name: Refresh active release guards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          for (const name of fs.readdirSync('scripts')) {
            if (!name.endsWith('.mjs')) continue;
            const file = path.join('scripts', name);
            let text = fs.readFileSync(file, 'utf8');
            text = text.replaceAll("'nexa-1-67'", "'nexa-1-68'");
            text = text.split('\n').map((line) => {
              if (
                (line.includes('pkg.version') || line.includes('packageJson.version'))
                && line.includes('1.67.0')
              ) {
                return line.replaceAll('1.67.0', '1.68.0');
              }
              if (line.includes("NEXA_VERSION = '1\\.67\\.0'")) {
                return line.replace("1\\.67\\.0", "1\\.68\\.0");
              }
              if (line.includes("nexa-1\\.67\\.0-verified")) {
                return line.replace("nexa-1\\.67\\.0-verified", "nexa-1\\.68\\.0-verified");
              }
              if (line.includes("nexa-1\\.67\\.0-verification-evidence")) {
                return line.replace("nexa-1\\.67\\.0-verification-evidence", "nexa-1\\.68\\.0-verification-evidence");
              }
              return line;
            }).join('\n');
            fs.writeFileSync(file, text);
          }
          NODE
      - name: Refresh committed lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Restore exact dependency tree
        run: npm ci --no-audit --no-fund
      - name: Verify migration checksums
        run: npm run test:migration-integrity
      - name: Apply PostgreSQL migrations
        run: npm run migrate
      - name: Static bridge observability contract
        run: npm run test:student-os-bridge-observability
      - name: Operational admission regression
        run: npm run test:student-os-bridge-operational-admission
      - name: PostgreSQL bridge observability
        run: npm run test:postgres-student-os-bridge-observability
      - name: TypeScript
        run: npm run typecheck
      - name: Commit finalized non-workflow source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(nexa): finalize 1.68 release guards"
          git push origin HEAD:stage/nexa-1.68.0-operational-observability
