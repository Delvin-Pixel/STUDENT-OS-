name: Stage NEXA 1.97 guards

on:
  push:
    branches: [stage/nexa-1.97.0-remediation-closure]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://nexa:nexa-ci-password@127.0.0.1:5432/nexa_test
      AI_GATEWAY_API_KEY: ci-placeholder-not-used-for-live-model-calls
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-0123456789abcdef
      NEXA_MODEL: openai/gpt-5.6-sol
      NEXA_STUDENT_OS_BRIDGE_SECRET: ci-only-student-os-bridge-secret-0123456789abcdef
      NEXA_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
      NEXA_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/nexa-1.97.0-remediation-closure
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - run: npm install --global npm@10.9.2
      - name: Refresh active release guards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          for (const name of fs.readdirSync('scripts')) {
            if (!name.endsWith('.mjs')) continue;
            if (name === 'test-data-api-remediation-closure.mjs') continue;
            const file = path.join('scripts', name);
            let source = fs.readFileSync(file, 'utf8');
            source = source.replaceAll("'nexa-1-96'", "'nexa-1-97'");
            source = source.split('\n').map((line) => {
              if ((line.includes('pkg.version') || line.includes('packageJson.version')) && line.includes('1.96.0')) {
                return line.replaceAll('1.96.0', '1.97.0');
              }
              if (line.includes("NEXA_VERSION = '1\\.96\\.0'")) {
                return line.replace("1\\.96\\.0", "1\\.97\\.0");
              }
              if (line.includes("nexa-1\\.96\\.0-verified")) {
                return line.replace("nexa-1\\.96\\.0-verified", "nexa-1\\.97\\.0-verified");
              }
              if (line.includes("nexa-1\\.96\\.0-verification-evidence")) {
                return line.replace("nexa-1\\.96\\.0-verification-evidence", "nexa-1\\.97\\.0-verification-evidence");
              }
              return line;
            }).join('\n');
            fs.writeFileSync(file, source);
          }
          NODE
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Exact install
        run: npm ci --no-audit --no-fund
      - name: Verify migration boundary
        run: npm run test:migration-integrity
      - name: Closure contract
        run: npm run test:data-api-remediation-closure
      - name: Handoff regression
        run: npm run test:data-api-remediation-handoff
      - name: Remediation readiness regression
        run: npm run test:data-api-remediation-readiness
      - name: Bridge readiness regression
        run: npm run test:student-os-bridge-readiness
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit finalized guards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(nexa): finalize 1.97 release guards"
          git push origin HEAD:stage/nexa-1.97.0-remediation-closure
