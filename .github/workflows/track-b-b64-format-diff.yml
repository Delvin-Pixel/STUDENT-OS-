name: Track B B64 format delta (temporary)

on:
  push:
    branches:
      - parallel/track-b-b64-three-way-preflight

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Generate formatting-only diff
        run: |
          pnpm exec prettier --write client/src/lib/offlineSyncPreflight.ts client/src/lib/offlineSyncPreflight.test.ts docs/parallel/B64.1-three-way-offline-preflight.md
          echo '===== BEGIN TRACK B64 FORMAT DIFF ====='
          git --no-pager diff -- client/src/lib/offlineSyncPreflight.ts client/src/lib/offlineSyncPreflight.test.ts docs/parallel/B64.1-three-way-offline-preflight.md
          echo '===== END TRACK B64 FORMAT DIFF ====='
