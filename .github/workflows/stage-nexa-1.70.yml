name: Stage NEXA 1.70 release guards

on:
  push:
    branches: [stage/nexa-1.70.0-preflight-failover]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://nexa:nexa-ci-password@127.0.0.1:5432/nexa_test
      AI_GATEWAY_API_KEY: ci-placeholder-not-used-for-live-model-calls
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-0123456789abcdef
      NEXA_MODEL: openai/gpt-5.6-sol
      NEXA_STUDENT_OS_BRIDGE_SECRET: ci-only-student-os-bridge-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/nexa-1.70.0-preflight-failover
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - run: npm install --global npm@10.9.2
      - name: Refresh active release guards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          for (const name of fs.readdirSync('scripts')) {
            if (!name.endsWith('.mjs')) continue;
            if (name === 'test-student-os-bridge-preflight-failover.mjs') continue;
            const file = path.join('scripts', name);
            let text = fs.readFileSync(file, 'utf8');
            text = text.replaceAll("'nexa-1-69'", "'nexa-1-70'");
            text = text.split('\n').map((line) => {
              if (
                (line.includes('pkg.version') || line.includes('packageJson.version'))
                && line.includes('1.69.0')
              ) {
                return line.replaceAll('1.69.0', '1.70.0');
              }
              if (line.includes("NEXA_VERSION = '1\\.69\\.0'")) {
                return line.replace("1\\.69\\.0", "1\\.70\\.0");
              }
              if (line.includes("nexa-1\\.69\\.0-verified")) {
                return line.replace("nexa-1\\.69\\.0-verified", "nexa-1\\.70\\.0-verified");
              }
              if (line.includes("nexa-1\\.69\\.0-verification-evidence")) {
                return line.replace("nexa-1\\.69\\.0-verification-evidence", "nexa-1\\.70\\.0-verification-evidence");
              }
              return line;
            }).join('\n');
            fs.writeFileSync(file, text);
          }
          NODE
      - name: Refresh committed lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Restore exact dependency tree
        run: npm ci --no-audit --no-fund
      - name: Verify migration boundary remains 042
        run: npm run test:migration-integrity
      - name: Preflight failover contract
        run: npm run test:student-os-bridge-preflight-failover
      - name: Fallback regression
        run: npm run test:student-os-bridge-fallback
      - name: Readiness regression
        run: npm run test:student-os-bridge-readiness
      - name: Operational admission regression
        run: npm run test:student-os-bridge-operational-admission
      - name: Provider contract compatibility
        run: npm run test:nexa-provider-contract
      - name: Vercel deployment isolation
        run: npm run test:vercel-deployment-isolation
      - name: Bridge contract regression
        run: npm run test:student-os-bridge
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit finalized non-workflow source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(nexa): finalize 1.70 release guards"
          git push origin HEAD:stage/nexa-1.70.0-preflight-failover
