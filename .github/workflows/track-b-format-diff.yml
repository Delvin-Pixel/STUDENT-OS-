name: Track B formatting delta (temporary)

on:
  push:
    branches:
      - parallel/track-b-nexa-transport-v1

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Generate formatting-only diff
        run: |
          pnpm exec prettier --write server/nexaBridgeTransport.ts server/nexaBridgeTransport.test.ts
          echo '===== BEGIN TRACK B FORMAT DIFF ====='
          git --no-pager diff -- server/nexaBridgeTransport.ts server/nexaBridgeTransport.test.ts
          echo '===== END TRACK B FORMAT DIFF ====='
