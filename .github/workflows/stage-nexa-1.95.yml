name: Stage NEXA 1.95 guards

on:
  push:
    branches: [stage/nexa-1.95.0-data-api-remediation-readiness]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/nexa-1.95.0-data-api-remediation-readiness
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - run: npm install --global npm@10.9.2
      - run: node scripts/finalize-nexa-1.95-release-guards.mjs
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run test:migration-integrity
      - run: npm run test:data-api-remediation-readiness
      - run: npm run test:data-api-remediation-plan
      - run: npm run test:data-api-effective-security
      - run: npm run test:student-os-bridge-readiness
      - run: npm run typecheck
      - name: Commit finalized guards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(nexa): finalize 1.95 release guards"
          git push origin HEAD:stage/nexa-1.95.0-data-api-remediation-readiness
