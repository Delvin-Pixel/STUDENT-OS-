name: Stage NEXA 1.93 guards

on:
  push:
    branches: [stage/nexa-1.93.0-data-api-effective-security]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: nexa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexa:test-password@127.0.0.1:5432/nexa_test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/nexa-1.93.0-data-api-effective-security
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - run: npm install --global npm@10.9.2
      - name: Refresh active release guards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          for (const name of fs.readdirSync('scripts')) {
            if (!name.endsWith('.mjs')) continue;
            if (name === 'test-data-api-effective-security.mjs') continue;
            const file = path.join('scripts', name);
            let source = fs.readFileSync(file, 'utf8');
            source = source.replaceAll("'nexa-1-92'", "'nexa-1-93'");
            source = source.split('\n').map((line) => {
              if ((line.includes('pkg.version') || line.includes('packageJson.version')) && line.includes('1.92.0')) {
                return line.replaceAll('1.92.0', '1.93.0');
              }
              if (line.includes("NEXA_VERSION = '1\\.92\\.0'")) {
                return line.replace("1\\.92\\.0", "1\\.93\\.0");
              }
              if (line.includes("nexa-1\\.92\\.0-verified")) {
                return line.replace("nexa-1\\.92\\.0-verified", "nexa-1\\.93\\.0-verified");
              }
              if (line.includes("nexa-1\\.92\\.0-verification-evidence")) {
                return line.replace("nexa-1\\.92\\.0-verification-evidence", "nexa-1\\.93\\.0-verification-evidence");
              }
              return line;
            }).join('\n');
            fs.writeFileSync(file, source);
          }
          NODE
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run test:migration-integrity
      - run: npm run migrate
      - run: npm run test:data-api-effective-security
      - run: npm run test:student-os-bridge-security-admission
      - run: npm run test:data-api-platform-readiness
      - run: npm run test:data-api-isolation-readiness
      - run: npm run test:data-api-remediation-plan
      - run: npm run test:runtime-role-security-readiness
      - run: npm run typecheck
      - name: Commit finalized guards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(nexa): finalize 1.93 release guards"
          git push origin HEAD:stage/nexa-1.93.0-data-api-effective-security
