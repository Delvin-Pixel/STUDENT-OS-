name: Stage NEXA 1.66 release guards

on:
  push:
    branches: [stage/nexa-1.66.0-deploy-isolation]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/nexa-1.66.0-deploy-isolation
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - run: npm install --global npm@10.9.2
      - name: Refresh active release guards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          for (const name of fs.readdirSync('scripts')) {
            if (!name.endsWith('.mjs')) continue;
            if (name === 'test-ai-gateway-readiness.mjs' || name === 'test-vercel-deployment-isolation.mjs') continue;
            const file = path.join('scripts', name);
            let text = fs.readFileSync(file, 'utf8');
            text = text
              .replaceAll('nexa-1-65', 'nexa-1-66')
              .replaceAll('1.65.0', '1.66.0')
              .replaceAll('1\\.65\\.0', '1\\.66\\.0');
            fs.writeFileSync(file, text);
          }

          {
            const file = 'scripts/test-ai-gateway-readiness.mjs';
            let text = fs.readFileSync(file, 'utf8');
            text = text
              .replace("assert.equal(pkg.name, 'nexa-1-65');", "assert.equal(pkg.name, 'nexa-1-66');")
              .replace("assert.equal(pkg.version, '1.65.0');", "assert.equal(pkg.version, '1.66.0');");
            fs.writeFileSync(file, text);
          }
          NODE
      - name: Refresh committed lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Restore exact dependency tree
        run: npm ci --no-audit --no-fund
      - name: Targeted 1.66 deployment contract
        run: npm run test:vercel-deployment-isolation
      - name: TypeScript
        run: npm run typecheck
      - name: Commit finalized non-workflow source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(nexa): finalize 1.66 release guards"
          git push origin HEAD:stage/nexa-1.66.0-deploy-isolation
