name: Stage NEXA 1.65 release guards

on:
  push:
    branches: [stage/nexa-1.65.0-gateway-readiness]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/nexa-1.65.0-gateway-readiness
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - run: npm install --global npm@10.9.2
      - name: Refresh active release guards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          for (const name of fs.readdirSync('scripts')) {
            if (!name.endsWith('.mjs')) continue;
            if (name === 'test-academic-context-binding.mjs' || name === 'test-ai-gateway-readiness.mjs') continue;
            const file = path.join('scripts', name);
            let text = fs.readFileSync(file, 'utf8');
            text = text
              .replaceAll('nexa-1-64', 'nexa-1-65')
              .replaceAll('1.64.0', '1.65.0')
              .replaceAll('1\\.64\\.0', '1\\.65\\.0');
            fs.writeFileSync(file, text);
          }

          {
            const file = 'scripts/test-academic-context-binding.mjs';
            let text = fs.readFileSync(file, 'utf8');
            text = text
              .replace("assert.equal(pkg.name, 'nexa-1-64');", "assert.equal(pkg.name, 'nexa-1-65');")
              .replace("assert.equal(pkg.version, '1.64.0');", "assert.equal(pkg.version, '1.65.0');");
            fs.writeFileSync(file, text);
          }

          {
            const file = '.github/workflows/verify.yml';
            let text = fs.readFileSync(file, 'utf8');
            text = text.replaceAll('nexa-1.64.0', 'nexa-1.65.0');
            fs.writeFileSync(file, text);
          }
          NODE
      - name: Refresh committed lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Restore exact dependency tree
        run: npm ci --no-audit --no-fund
      - name: Targeted 1.65 contract
        run: npm run test:ai-gateway-readiness
      - name: TypeScript
        run: npm run typecheck
      - name: Remove staging workflow and commit finalized source
        shell: bash
        run: |
          rm .github/workflows/stage-nexa-1.65.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(nexa): finalize 1.65 release guards"
          git push origin HEAD:stage/nexa-1.65.0-gateway-readiness
