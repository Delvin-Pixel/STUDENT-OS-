name: Stage NEXA 1.86 security guards

on:
  push:
    branches: [stage/nexa-1.86.0-default-privileges]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexa
          POSTGRES_PASSWORD: nexa-ci-password
          POSTGRES_DB: nexa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexa -d nexa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexa:nexa-ci-password@127.0.0.1:5432/nexa_test
      AI_GATEWAY_API_KEY: ci-placeholder-not-used-for-live-model-calls
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-0123456789abcdef
      NEXA_MODEL: openai/gpt-5.6-sol
      NEXA_STUDENT_OS_BRIDGE_SECRET: ci-only-student-os-bridge-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/nexa-1.86.0-default-privileges
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - run: npm install --global npm@10.9.2
      - name: Refresh active release guards
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          for (const name of fs.readdirSync('scripts')) {
            if (!name.endsWith('.mjs')) continue;
            if (name === 'test-runtime-role-default-privileges.mjs') continue;
            const file = path.join('scripts', name);
            let source = fs.readFileSync(file, 'utf8');
            source = source.replaceAll("'nexa-1-85'", "'nexa-1-86'");
            source = source.split('\n').map((line) => {
              if ((line.includes('pkg.version') || line.includes('packageJson.version')) && line.includes('1.85.0')) {
                return line.replaceAll('1.85.0', '1.86.0');
              }
              if (line.includes("NEXA_VERSION = '1\\.85\\.0'")) {
                return line.replace("1\\.85\\.0", "1\\.86\\.0");
              }
              if (line.includes("nexa-1\\.85\\.0-verified")) {
                return line.replace("nexa-1\\.85\\.0-verified", "nexa-1\\.86\\.0-verified");
              }
              if (line.includes("nexa-1\\.85\\.0-verification-evidence")) {
                return line.replace("nexa-1\\.85\\.0-verification-evidence", "nexa-1\\.86\\.0-verification-evidence");
              }
              return line;
            }).join('\n');
            fs.writeFileSync(file, source);
          }
          NODE
      - name: Refresh committed lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Restore exact dependency tree
        run: npm ci --no-audit --no-fund
      - name: Verify migration boundary remains 045
        run: npm run test:migration-integrity
      - name: Apply migrations
        run: npm run migrate
      - name: Runtime attestation regression
        run: npm run test:runtime-role-attestation
      - name: Runtime security readiness regression
        run: npm run test:runtime-role-security-readiness
      - name: Exact runtime privilege regression
        run: npm run test:runtime-role-exact-privileges
      - name: Default privilege contract
        run: npm run test:runtime-role-default-privileges
      - name: PostgreSQL current privilege attestation
        run: npm run test:postgres-runtime-role-attestation
      - name: PostgreSQL default privilege drift
        run: npm run test:postgres-runtime-default-privileges
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit finalized non-workflow source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(nexa): finalize 1.86 release guards"
          git push origin HEAD:stage/nexa-1.86.0-default-privileges
