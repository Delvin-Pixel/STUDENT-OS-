name: B62.7 formatting helper

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: startsWith(github.head_ref, 'track-a/b62-7-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write drizzle/meta/0018_snapshot.json drizzle/schema.ts server/academicPolicyGovernanceLedger.test.ts server/academicPolicyGovernanceLedger.ts shared/academicPolicyGovernanceLedger.ts
      - name: Commit formatted files on the isolated feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/meta/0018_snapshot.json drizzle/schema.ts server/academicPolicyGovernanceLedger.test.ts server/academicPolicyGovernanceLedger.ts shared/academicPolicyGovernanceLedger.ts
          if git diff --cached --quiet; then
            echo "Formatter produced no changes."
            exit 0
          fi
          git commit -m "style(academic): apply repository Prettier formatting"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${HEAD_REF}"
