name: B62.7 formatting helper

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format:
    if: startsWith(github.head_ref, 'track-a/b62-7-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write drizzle/meta/0018_snapshot.json drizzle/schema.ts server/academicPolicyGovernanceLedger.test.ts server/academicPolicyGovernanceLedger.ts shared/academicPolicyGovernanceLedger.ts
      - run: |
          mkdir -p /tmp/b62-format
          cp drizzle/meta/0018_snapshot.json drizzle/schema.ts server/academicPolicyGovernanceLedger.test.ts server/academicPolicyGovernanceLedger.ts shared/academicPolicyGovernanceLedger.ts /tmp/b62-format/
          cd /tmp/b62-format
          zip -q /tmp/b62-format.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: b62-formatted-files
          path: /tmp/b62-format.zip
          if-no-files-found: error
          retention-days: 1
