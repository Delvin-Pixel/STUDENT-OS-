name: Stage NEXA 1.94 guards

on:
  push:
    branches: [stage/nexa-1.94.0-data-api-remediation-readiness]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://nexa:nexa-ci-password@127.0.0.1:5432/nexa_test
      AI_GATEWAY_API_KEY: ci-placeholder-not-used-for-live-model-calls
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-0123456789abcdef
      NEXA_MODEL: openai/gpt-5.6-sol
      NEXA_STUDENT_OS_BRIDGE_SECRET: ci-only-student-os-bridge-secret-0123456789abcdef
      NEXA_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
      NEXA_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/nexa-1.94.0-data-api-remediation-readiness
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - run: npm install --global npm@10.9.2
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Verify migration boundary remains 047
        run: npm run test:migration-integrity
      - name: Platform-aware remediation plan
        run: npm run test:data-api-remediation-plan
      - name: Remediation runtime readiness
        run: npm run test:data-api-remediation-readiness
      - name: Effective security regression
        run: npm run test:data-api-effective-security
      - name: Data API platform regression
        run: npm run test:data-api-platform-readiness
      - name: Data API isolation regression
        run: npm run test:data-api-isolation-readiness
      - name: Student OS bridge readiness regression
        run: npm run test:student-os-bridge-readiness
      - name: Student OS security admission regression
        run: npm run test:student-os-bridge-security-admission
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit finalized lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(nexa): finalize 1.94 lockfile"
          git push origin HEAD:stage/nexa-1.94.0-data-api-remediation-readiness
